<div class="min-h-screen bg-sigt-bg">
  <header class="max-w-5xl mx-auto px-6 pt-10">
    <h1 class="text-3xl font-semibold text-sigt-primary">SIGT - Sistema Gerenciador de TCC</h1>
  </header>

  <main class="max-w-5xl mx-auto px-6">
    <section class="mt-8 bg-white rounded-xl shadow-sm border border-black/5">
      <div class="px-8 py-10 max-w-xl mx-auto">
        <h2 class="text-xl font-semibold text-sigt-text text-center">Crie sua conta</h2>

        <form class="mt-8 space-y-5" (ngSubmit)="submit()" [formGroup]="form">
          <div>
            <label class="block text-sm font-medium text-sigt-text/90">Matrícula</label>
            <input type="text" formControlName="matricula" placeholder="Digite apenas números" inputmode="numeric"
              pattern="[0-9]*"
              class="mt-2 w-full rounded-lg border px-4 py-3 focus:ring-2 focus:ring-sigt-primary/30 outline-none transition"
              [class.border-red-400]="fieldInvalid('matricula')" />
            <p *ngIf="fieldInvalid('matricula')" class="mt-1 text-sm text-red-600">
              A matrícula deve conter apenas números.
            </p>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-sigt-text/90">Senha</label>
            
            <div class="relative mt-2">
              <input [type]="showPassword ? 'text' : 'password'" 
                formControlName="senha" 
                (input)="checkStrength()" 
                placeholder="Mínimo 8 caracteres"
                class="w-full rounded-lg border px-4 py-3 pr-12 outline-none focus:ring-2 focus:ring-sigt-primary/30 transition"
                [class.border-red-400]="fieldInvalid('senha')" />
              
              <button type="button" (click)="togglePassword()"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-sigt-primary transition-colors focus:outline-none">
                <span *ngIf="!showPassword" class="text-lg">👁️‍🗨️</span>
                <span *ngIf="showPassword" class="text-lg">👁️</span>
              </button>
            </div>

            <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-gray-200">
              <div class="h-full transition-all duration-500" [style.width.%]="passwordStrength" [ngClass]="{
                'bg-red-500': passwordStrength <= 25,
                'bg-yellow-500': passwordStrength > 25 && passwordStrength <= 75,
                'bg-green-500': passwordStrength > 75
              }"></div>
            </div>

            <p class="mt-1 text-[10px] text-gray-500 italic">
              Dica: Use letras maiúsculas, números e símbolos para uma senha forte.
            </p>
            <p *ngIf="fieldInvalid('senha')" class="mt-1 text-sm text-red-600">
              A senha não atende aos requisitos de segurança.
            </p>
          </div>

          <button type="submit"
            class="bg-[#0A5EA8] text-white w-full rounded-lg py-3.5 font-medium shadow-sm hover:brightness-110 active:brightness-95 transition disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="isSubmitting || form.invalid">
            <span *ngIf="!isSubmitting">Cadastrar</span>
            <span *ngIf="isSubmitting">Criando conta...</span>
          </button>

          <div class="text-center pt-1">
            <span class="text-sm text-sigt-text/70">Já tem uma conta? </span>
            <a routerLink="/login" class="text-sm font-medium text-sigt-primary hover:underline">
              Voltar para o Login
            </a>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>
